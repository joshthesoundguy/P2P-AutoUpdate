<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Studio scene placeholder — an artist seated among vivid abstract paintings. Replace with hero.jpg.">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F3EC"/><stop offset="1" stop-color="#EBE3D6"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D8CDB9"/><stop offset="1" stop-color="#C2B49B"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset="1" stop-color="#E7EEF5"/></linearGradient>
    <filter id="grn"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer></filter>
  </defs>

  <!-- wall + floor -->
  <rect width="1600" height="640" fill="url(#wall)"/>
  <rect y="640" width="1600" height="260" fill="url(#floor)"/>

  <!-- window -->
  <rect x="70" y="60" width="250" height="430" fill="url(#win)"/>
  <rect x="70" y="60" width="250" height="430" fill="none" stroke="#D9D2C4" stroke-width="10"/>
  <line x1="195" y1="60" x2="195" y2="490" stroke="#D9D2C4" stroke-width="8"/>
  <line x1="70" y1="245" x2="320" y2="245" stroke="#D9D2C4" stroke-width="8"/>

  <!-- leaning paintings, left -->
  <g transform="rotate(-4 250 560)">
    <rect x="120" y="320" width="270" height="380" fill="#16224A"/>
    <path d="M120 560 Q250 470 390 540" stroke="#2954A3" stroke-width="46" fill="none" stroke-linecap="round"/>
    <path d="M150 640 Q260 560 380 620" stroke="#5C86C9" stroke-width="30" fill="none" stroke-linecap="round"/>
    <circle cx="300" cy="430" r="44" fill="#C8A86B" opacity="0.85"/>
  </g>

  <!-- painting cluster, right wall -->
  <g>
    <rect x="1180" y="90" width="180" height="220" fill="#241B0E"/>
    <path d="M1190 220 Q1270 150 1350 210" stroke="#D86A17" stroke-width="34" fill="none" stroke-linecap="round"/>
    <path d="M1200 260 Q1275 210 1350 250" stroke="#C8A86B" stroke-width="20" fill="none" stroke-linecap="round"/>

    <rect x="1410" y="60" width="150" height="430" fill="#3A1430"/>
    <rect x="1470" y="120" width="26" height="240" rx="13" fill="#E8A93A"/>
    <rect x="1440" y="200" width="86" height="26" rx="13" fill="#E8A93A"/>
    <path d="M1420 420 Q1490 360 1555 410" stroke="#D86A17" stroke-width="30" fill="none" stroke-linecap="round"/>
  </g>

  <!-- large vivid canvas behind figure -->
  <g>
    <rect x="690" y="300" width="430" height="300" fill="#0E1730"/>
    <rect x="700" y="330" width="410" height="40" fill="#2954A3" opacity="0.9"/>
    <rect x="700" y="380" width="410" height="34" fill="#D86A17" opacity="0.85"/>
    <rect x="700" y="424" width="410" height="40" fill="#7A1111" opacity="0.85"/>
    <rect x="700" y="474" width="410" height="34" fill="#C8A86B" opacity="0.85"/>
    <rect x="700" y="518" width="410" height="50" fill="#2E6B4F" opacity="0.8"/>
  </g>

  <!-- seated figure silhouette -->
  <g fill="#15110D">
    <rect x="540" y="640" width="170" height="70" rx="10" opacity="0.92"/>
    <path d="M560 645 q65 -180 110 0 z"/>
    <rect x="585" y="470" width="60" height="120" rx="26"/>
    <circle cx="615" cy="455" r="34"/>
    <rect x="560" y="690" width="22" height="120" rx="10"/>
    <rect x="650" y="690" width="22" height="120" rx="10"/>
  </g>

  <!-- foreground brushes / cans -->
  <g>
    <rect x="60" y="760" width="120" height="120" rx="6" fill="#7A1111"/>
    <rect x="60" y="760" width="120" height="30" fill="#C8A86B"/>
    <g stroke-linecap="round">
      <line x1="250" y1="870" x2="270" y2="740" stroke="#1D2A52" stroke-width="9"/>
      <line x1="275" y1="872" x2="300" y2="745" stroke="#D86A17" stroke-width="9"/>
      <line x1="300" y1="872" x2="330" y2="752" stroke="#C8A86B" stroke-width="9"/>
    </g>
    <rect x="1320" y="780" width="130" height="110" rx="8" fill="#1D2A52"/>
    <rect x="1320" y="780" width="130" height="26" fill="#D86A17"/>
  </g>

  <!-- paint splatter on floor -->
  <g opacity="0.8">
    <circle cx="500" cy="840" r="10" fill="#D86A17"/><circle cx="540" cy="860" r="6" fill="#2954A3"/>
    <circle cx="900" cy="850" r="9" fill="#7A1111"/><circle cx="960" cy="835" r="5" fill="#C8A86B"/>
    <circle cx="1100" cy="865" r="7" fill="#2E6B4F"/>
  </g>

  <rect width="1600" height="900" filter="url(#grn)" opacity="0.05"/>
</svg>
